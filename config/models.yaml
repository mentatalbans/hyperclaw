# HyperClaw Model Registry
models:
  claude-fable-5:
    provider: anthropic
    cost_per_1k_input: 0.010
    cost_per_1k_output: 0.050
    latency_ms: 6000
    max_tokens: 16000
    suitable_tasks: [research, analysis, synthesis, planning, code, health, finance, scientific]
    note: "Top tier — hardest multi-step work. Thinking always on."

  claude-sonnet-5:
    provider: anthropic
    cost_per_1k_input: 0.002
    cost_per_1k_output: 0.010
    latency_ms: 2000
    max_tokens: 16000
    suitable_tasks: [research, analysis, synthesis, planning, code, health, finance, scientific]

  claude-opus-5:
    provider: anthropic
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.025
    latency_ms: 4000
    max_tokens: 16000
    suitable_tasks: [research, analysis, synthesis, planning, code, health, finance, scientific]

  claude-haiku-4-5:
    provider: anthropic
    cost_per_1k_input: 0.001
    cost_per_1k_output: 0.005
    latency_ms: 500
    max_tokens: 4096
    suitable_tasks: [routing, classification, quick_lookup, summarization, draft, triage, status_check]

  claude-code:
    provider: anthropic
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    latency_ms: 3000
    max_tokens: 8192
    suitable_tasks: [code]

  chatjimmy:
    provider: chatjimmy
    cost_per_1k_input: 0.000001
    cost_per_1k_output: 0.000001
    latency_ms: 50
    max_tokens: 2048
    suitable_tasks: [routing, classification, quick_lookup, summarization, draft, triage, status_check]
    note: "Powered by Taalas HC1 silicon — Llama 3.1 8B at 17,000 tokens/sec. Never auto-certified."

  openai/custom:
    provider: openai
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    latency_ms: 500
    max_tokens: 32768
    suitable_tasks: [research, analysis, synthesis, planning, code, health, finance, scientific]
    note: "HyperNimbus vLLM — hyper-nimbus/hyperspeed-v11-merged. Set OPENAI_API_BASE and OPENAI_API_KEY."

  nim-local:
    provider: nim
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    latency_ms: 500
    max_tokens: 4096
    suitable_tasks: [research, analysis, code]

  zimage-turbo:
    provider: replicate
    type: image_generation
    cost_per_image: 0.004
    latency_ms: 1000
    max_resolution: 1024x1024
    suitable_tasks: [image_generation, illustration, diagram, visualization, creative_art, mockup, logo]
    note: "Zimage Turbo via Replicate — 6B params, sub-second generation, strong text rendering"

# ── Provider routing (1.2.0) ─────────────────────────────────────────────
# A provider is LIVE only if every *_env below resolves to a non-empty
# value; slot ladders are filtered to live providers at startup. Rename or
# add entries freely — "hyperspeed" is a placeholder name for any
# OpenAI-compatible endpoint (Ollama, vLLM, a hosted gateway...).
providers:
  anthropic:
    kind: anthropic            # native Messages API
    api_key_env: ANTHROPIC_API_KEY
    capabilities: [chat, streaming, tool_use, images, documents, thinking]
    models: {default: claude-sonnet-4-6, fast: claude-haiku-4-5-20251001, strong: claude-opus-4-8,
             standard: claude-sonnet-5, premium: claude-opus-5, flagship: claude-fable-5}
  hyperspeed:
    kind: openai_compat
    base_url_env: HYPERSPEED_BASE_URL
    api_key_env: HYPERSPEED_API_KEY
    model_env: HYPERSPEED_MODEL
    capabilities: [chat, streaming]
  chatjimmy:
    kind: openai_compat
    base_url_env: CHATJIMMY_BASE_URL   # official Taalas API URL (by application); NOT the chatjimmy.ai demo
    api_key_env: CHATJIMMY_API_KEY
    model_env: CHATJIMMY_MODEL
    capabilities: [chat, streaming, fast]
  openai:
    kind: openai
    api_key_env: OPENAI_API_KEY
    capabilities: [chat, streaming, tool_use, images, embeddings, image_generation]
    models: {default: gpt-5.2, fast: gpt-5.2-mini}

slots:
  primary:    [hyperspeed, anthropic]
  tools:      [anthropic]
  vision:     [anthropic, hyperspeed]
  fast:       [chatjimmy, anthropic:fast, hyperspeed]
  embeddings: [openai, hyperspeed]
  images:     [openai]
