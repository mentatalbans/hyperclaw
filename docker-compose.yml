services:
  hyperclaw:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      HYPERCLAW_ROOT: /app/data
      HYPERCLAW_PROVIDER: ${HYPERCLAW_PROVIDER:-ollama}
      HYPERCLAW_MODEL: ${HYPERCLAW_MODEL:-qwen3.8:27b-mlx}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.8:27b-mlx}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      HYPERCLAW_ENABLE_TELEGRAM: ${HYPERCLAW_ENABLE_TELEGRAM:-false}
      HYPERCLAW_ENABLE_SCHEDULER: ${HYPERCLAW_ENABLE_SCHEDULER:-false}
      HYPERCLAW_ENABLE_TOOLS: ${HYPERCLAW_ENABLE_TOOLS:-false}
      HYPERCLAW_ENABLE_DATABASE: ${HYPERCLAW_ENABLE_DATABASE:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - hyperclaw_data:/app/data

volumes:
  hyperclaw_data:
