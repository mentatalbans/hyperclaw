[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
asyncio_mode = strict
addopts = --strict-markers
junit_family = xunit1
markers =
    integration: real local application process and HTTP boundary
    postgres: disposable PostgreSQL server required
    ollama: opt-in live Ollama model checks (enable with --run-ollama)
