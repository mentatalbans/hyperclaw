[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperclaw"
version = "2.0.0.dev0"
description = "A durable local assistant runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2", "httpx>=0.28", "fastapi>=0.109", "uvicorn>=0.27", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=7", "coverage>=7.10"]
browser = ["playwright>=1.58,<2"]

[project.scripts]
hyperclaw = "hyperclaw.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperclaw = ["web/*.html", "web/*.js", "web/*.css"]
